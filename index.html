<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isla Extra — Extras rápidos en Eivissa y Formentera</title>
<meta name="description" content="Personal extra verificado uno a uno en Eivissa y Formentera. Dices la hora exacta que necesitas y te proponemos solo a quien está libre y ya ha confirmado.">
<meta name="theme-color" content="#F5F1E7">
<meta property="og:type" content="website">
<meta property="og:title" content="Isla Extra — Extras rápidos en Eivissa y Formentera">
<meta property="og:description" content="Personal extra verificado uno a uno en Eivissa y Formentera. Dices la hora exacta y te proponemos solo a quien está libre y ya ha dicho que sí.">
<meta property="og:url" content="https://lucaderr89.github.io/islaextra/">
<meta property="og:image" content="https://lucaderr89.github.io/islaextra/assets/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=zodiak@400,700,800&f[]=switzer@400,500,600,700&display=swap">
<link rel="stylesheet" href="assets/css/style.css?v=8">
<link rel="icon" type="image/png" href="assets/img/logo.png">
<link rel="apple-touch-icon" href="assets/img/logo.png">
</head>
<body>

<!-- ====================================================== TESTATA ====== -->
<header class="site-head">
  <div class="wrap head-inner">
    <a class="logo" href="#top">
      <img src="assets/img/logo.png" alt="Isla Extra" width="34" height="34">
      <span class="logo-text">Isla Extra</span>
    </a>
    <div class="head-right">
      <div class="lang" role="group" aria-label="Idioma">
        <button type="button" class="lang-btn is-on" data-lang="es">ES</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="it">IT</button>
      </div>
    </div>
  </div>
</header>

<main id="top">

  <!-- =================================================== HERO ========= -->
  <section class="hero">
    <div class="wrap hero-grid">

      <div class="hero-copy">
        <img class="hero-flor" src="assets/img/flor-velo.png" alt="" aria-hidden="true">
        <p class="badge"><span class="dot-live"></span><span data-i18n="hero_badge"></span></p>
        <h1 data-i18n="hero_title"></h1>
        <p class="lead" data-i18n="hero_sub"></p>

        <div class="stats">
          <div class="stat"><b class="js-count" id="statAvail">0</b><span data-i18n="stat_available"></span></div>
          <div class="stat"><b class="js-count" id="statComp">0</b><span data-i18n="stat_companies"></span></div>
          <div class="stat"><b class="js-count" id="statMatch">0</b><span data-i18n="stat_matches"></span></div>
          <div class="stat"><b class="js-count" id="statAvg">0</b><span data-i18n="stat_avg"></span></div>
        </div>
      </div>

      <aside class="hero-side">
        <figure class="hero-photo">
          <img src="assets/img/foto-noche.jpg" alt="" width="1400" height="875">
        </figure>
        <div class="feed-card" aria-live="polite">
          <div class="feed-head">
            <span class="feed-title" data-i18n="feed_title"></span>
            <span class="feed-live"><span class="dot-live"></span><span data-i18n="feed_live"></span></span>
          </div>
          <ul class="feed" id="feed"></ul>
        </div>
      </aside>

    </div>
  </section>

  <!-- =================================================== TICKER ======= -->
  <div class="ticker" aria-hidden="true">
    <div class="ticker-track" id="ticker"></div>
  </div>

  <!-- =================================================== PORTE ======== -->
  <section class="doors" id="doors">
    <button type="button" class="door door-company rv" data-open="company">
      <span class="door-media"><img src="assets/img/foto-negocio.jpg" alt="" width="1200" height="675" loading="lazy"></span>
      <span class="door-kicker" data-i18n="door_company_kicker"></span>
      <span class="door-title" data-i18n="door_company_title"></span>
      <span class="door-text" data-i18n="door_company_text"></span>
      <span class="door-cta"><span data-i18n="door_company_cta"></span>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </button>

    <button type="button" class="door door-worker rv" data-open="worker">
      <span class="door-media"><img src="assets/img/foto-oficio.jpg" alt="" width="1200" height="675" loading="lazy"></span>
      <span class="door-kicker" data-i18n="door_worker_kicker"></span>
      <span class="door-title" data-i18n="door_worker_title"></span>
      <span class="door-text" data-i18n="door_worker_text"></span>
      <span class="door-cta"><span data-i18n="door_worker_cta"></span>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </button>
  </section>

  <!-- =================================================== DEMO ========= -->
  <section class="demo" id="demo" hidden>
    <div class="wrap">
      <div class="demo-bar">
        <button type="button" class="btn-ghost" id="demoClose">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M19 12H6M11 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="demo_close"></span>
        </button>
        <span class="demo-note" data-i18n="demo_note"></span>
        <button type="button" class="btn-ghost" id="demoSwitch"><span></span></button>
      </div>

      <div id="panelCompany">
        <div class="panel-head">
          <span class="panel-chip" data-i18n="demo_company_title"></span>
          <span class="panel-who" id="coWho"></span>
        </div>
        <div id="coStage"></div>
      </div>

      <div id="panelWorker" hidden>
        <div class="panel-head">
          <span class="panel-chip" data-i18n="demo_worker_title"></span>
          <span class="panel-who" id="wkWho"></span>
        </div>
        <div id="wkStage"></div>
      </div>
    </div>
  </section>

</main>

<footer class="site-foot">
  <div class="wrap foot-grid">
    <div class="foot-logo">
      <img src="assets/img/logo-calce.png" alt="" width="42" height="42">
      <b>Isla Extra</b>
    </div>
    <div>
      <p data-i18n="foot_concept"></p>
      <p class="muted" data-i18n="foot_note"></p>
    </div>
    <img class="foot-nodo" src="assets/img/nodo-calce.png" alt="" aria-hidden="true" loading="lazy">
  </div>
</footer>

<script src="assets/js/i18n.js?v=8"></script>
<script src="assets/js/data.js?v=8"></script>
<script src="assets/js/app.js?v=8"></script>
</body>
</html>
